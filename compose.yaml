# PostgreSQL 17 primary with one streaming replica, and Redis.
# Ports: primary 5470, replica 5471, redis 6390.
services:
  primary:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: shop
    command: >
      postgres -c wal_level=replica -c max_wal_senders=10 -c hot_standby=on
               -c shared_buffers=1GB -c work_mem=64MB -c maintenance_work_mem=512MB
               -c track_io_timing=on
    volumes:
      - ./db/primary-init.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
    ports: ["5470:5432"]
    shm_size: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d shop"]
      interval: 2s
      retries: 30

  replica:
    image: postgres:17
    depends_on:
      primary: {condition: service_healthy}
    environment:
      PGPASSWORD: replica
    entrypoint: ["bash", "/replica-start.sh"]
    volumes:
      - ./db/replica-start.sh:/replica-start.sh:ro
    ports: ["5471:5432"]
    shm_size: 1g

  redis:
    image: redis:7.4
    ports: ["6390:6379"]
