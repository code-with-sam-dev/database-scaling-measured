spring.application.name=scaling
server.port=${PORT:8081}
# Virtual threads, so 500 concurrent requests are not capped by a thread pool
# before they ever reach the cache. The experiment counts database loads.
spring.threads.virtual.enabled=true

primary.url=jdbc:postgresql://localhost:5470/shop
replica.url=jdbc:postgresql://localhost:5471/shop
db.username=app
db.password=app

spring.data.redis.port=6390

# none | local | redis: how concurrent cache misses are coordinated.
cache.coalescing=${COALESCING:none}
cache.ttl-seconds=60
